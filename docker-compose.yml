services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - earn-proxy-data:/var/lib/earn-proxy
    expose:
      - "8000"

  health-checker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.check_service", "--worker", "health"]
    volumes:
      - earn-proxy-data:/var/lib/earn-proxy

  earnapp-checker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.check_service", "--worker", "earnapp"]
    volumes:
      - earn-proxy-data:/var/lib/earn-proxy

  maintenance:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.maintenance_service"]
    volumes:
      - earn-proxy-data:/var/lib/earn-proxy

  payout-verifier:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.payout_verifier_service"]
    volumes:
      - earn-proxy-data:/var/lib/earn-proxy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      EARN_PROXY_DOMAIN: ${EARN_PROXY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  earn-proxy-data:
  caddy-data:
  caddy-config:
