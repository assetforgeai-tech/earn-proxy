[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "earn-proxy"
version = "0.1.0"
description = "A small, self-hosted proxy contribution and earnings service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "cryptography>=50,<51",
  "flask>=3.1,<4",
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "requests[socks]>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
earn-proxy-checker = "app.check_service:main"
earn-proxy-maintenance = "app.maintenance_service:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "SIM"]
ignore = ["E501"]
